<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoe Hickey</title>
    <script>
      // See https://github.com/rafgraph/spa-github-pages
      // Redirects unknown paths back to index.html with the original path
      // encoded in the query string, so React Router can pick it back up.
      var segmentCount = 1 // matches the "/zhj/" base path
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
